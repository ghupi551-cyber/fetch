org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official

# 在 aarch64 Linux 上用 Termux 的原生 aapt2 时，取消下一行注释并改成你的路径
# android.aapt2FromMavenOverride=/opt/tools/aapt2

# 签名信息（可选）：想产出已签名包时填自己的 keystore
# videolink.storeFile=/path/to/your.jks
# videolink.storePassword=your_store_password
# videolink.keyAlias=your_alias
# videolink.keyPassword=your_key_password
